<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>โปรไฟล์ของฉัน — กินอะไรดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="profile">

  <div class="app-shell">
    <aside class="app-sidebar" id="app-sidebar"></aside>
    <div class="app-sidebar-overlay" id="app-sidebar-overlay"></div>

    <div class="mobile-topbar">
      <button class="mobile-topbar-toggle" aria-label="เปิดเมนู">☰</button>
      <a href="dashboard.html" class="brand"><span class="brand-mark">🍲</span> กินอะไรดี</a>
    </div>

    <main class="app-main">
      <div class="app-main-inner" style="max-width:640px">
        <h1 style="margin-bottom:20px">โปรไฟล์ของฉัน</h1>

        <div class="panel">
          <div id="form-error" class="form-error"></div>
          <form id="profile-form">
            <div class="field">
              <label for="name">ชื่อที่ใช้แสดงผล</label>
              <input type="text" id="name" class="input" required />
            </div>

            <div class="field-row two">
              <div class="field">
                <label for="age">อายุ (ปี)</label>
                <input type="number" id="age" class="input" min="1" max="120" />
              </div>
              <div class="field">
                <label for="weight">น้ำหนัก (กก.)</label>
                <input type="number" id="weight" class="input" min="1" step="0.1" />
              </div>
            </div>
            <div class="field">
              <label for="height">ส่วนสูง (ซม.)</label>
              <input type="number" id="height" class="input" min="1" />
            </div>

            <div class="field">
              <label>อาการแพ้ / โรคประจำตัว</label>
              <div id="condition-grid" class="condition-grid"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top:10px">บันทึกการเปลี่ยนแปลง</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
